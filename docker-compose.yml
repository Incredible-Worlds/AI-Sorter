services:
  db:
    image: postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: BlazorApp
    volumes:
      - ./bd/:/docker-entrypoint-initdb.d

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    depends_on:
      - db

  frontend:
    build:
      context: "./AI Sorter"
      dockerfile: Dockerfile
    ports:
      - 80:80
    restart: always
    depends_on:
      - backend

  backend:
    build:
      context: "./AI Sorter Backend"
      dockerfile: Dockerfile
    restart: always
    ports:
      - 5001:5001
    depends_on:
      - db