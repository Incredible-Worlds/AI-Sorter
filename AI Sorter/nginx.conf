events {}

http {
    include mime.types;
    default_type application/octet-stream;

    types {
        application/wasm wasm;
        application/javascript mjs;
    }

    server {
        listen 80 default_server;
        server_name _;  # Можно указать домен или оставить "_" для всех.

        root /var/www/web;
        index index.html;

        # Обработка API-запросов
        location /api/ {
            proxy_pass http://backend:5001/api/;  # Адрес бэкенда, если это контейнер, поменяй на правильный IP.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS заголовки для API
            add_header 'Access-Control-Allow-Origin' '*';  # Можно указать домен, если нужен только он
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Requested-With, Authorization';
            add_header 'Access-Control-Allow-Credentials' 'true';

            # Обработка запроса OPTIONS для CORS
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE';
                add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Requested-With, Authorization';
                add_header 'Access-Control-Allow-Credentials' 'true';
                return 204;  # Отправляем пустой ответ на OPTIONS запрос
            }
        }

        # Основная страница и обработка статичных файлов
        location / {
            # CORS для фронтенда
            add_header 'Access-Control-Allow-Origin' '*';  # Или указать конкретный домен
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

            try_files $uri $uri/ /index.html;
        }

        # Оптимизация кеша для статики
        location ~* \.(?:wasm|dll|js|mjs|css|html|json|png|jpg|jpeg|gif|woff2?|ttf|svg|eot|ico|webp)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public";
        }
    }
}
